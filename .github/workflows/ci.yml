name: CI

on:
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: >-
      github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name == github.repository || contains(github.event.pull_request.labels.*.name, 'run-ci'))
    permissions:
      contents: read
    runs-on: ${{ fromJSON(vars.ACTIONS_RUNNER_LABELS_CI || '["ubuntu-latest"]') }}
    steps:
      - name: Start work budget
        shell: bash
        run: echo "VERIFY_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run linting
        run: npm run lint
      - name: Run type checking
        run: npm run typecheck
      - name: Affected unit tests
        shell: bash
        env:
          BASE_SHA: "${{ github.event.pull_request.base.sha }}"
        run: npx vitest run --changed "$BASE_SHA" --passWithNoTests --maxWorkers=2
      - name: Work budget (300 seconds)
        if: always()
        shell: bash
        run: |-
          elapsed=$(( $(date +%s) - VERIFY_STARTED ))
          echo "verify: ${elapsed}s / 300s"
          [[ $elapsed -le 300 ]]
    timeout-minutes: 10
